[asr]
backend = "faster-whisper"
model = "bundled:faster-whisper-tiny"
device = "auto"
compute_type = "auto"
language = "auto"

[text]
remove_fillers = true
auto_punctuation = true
script = "simplified"
semantic_correction_enabled = true
semantic_intent_backend = "rules"

[input]
injector = "auto"
dry_run = false
backspace_delay = 0.0

[audio]
sample_rate = 16000
frame_ms = 30
silence_ms = 700
max_utterance_s = 12
activation_timeout_s = 8
min_voice_ms = 240
energy_threshold = 0.012

[daemon]
hotkey = "ctrl+space"
hotkey_mode = "toggle"
hold_min_s = 0.25
toggle_debounce_s = 0.8
restore_focus = true
