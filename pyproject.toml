[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxflow"
version = "0.2.0"
description = "轻量级 Linux 中文/英文语音输入法"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VoxFlow contributors" }]
dependencies = ["OpenCC>=1.3.1,<2", "faster-whisper>=1.1.0", "huggingface_hub>=0.23"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1.0"]
qwen = ["qwen-asr>=0.0.6"]
mic = ["sounddevice>=0.5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
voxflow = "voxflow.cli:main"
voxflow-ibus-engine = "voxflow.ibus_engine:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"voxflow" = ["web/*", "bundled/faster-whisper-tiny/*"]
