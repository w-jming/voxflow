<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>声流输入法</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>声流输入法</h1>
          <p id="configLine">加载中</p>
        </div>
        <div class="status" id="status" data-state="ready">
          <span class="status-dot"></span>
          <span id="statusText">就绪</span>
        </div>
      </header>

      <section class="workspace">
        <div class="record-panel">
          <div class="meter-wrap">
            <canvas id="meter" width="920" height="360"></canvas>
            <div class="level-ring" id="levelRing">
              <button id="recordBtn" class="record-btn" aria-label="开始录音">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"></path>
                  <path d="M5 11a7 7 0 0 0 14 0"></path>
                  <path d="M12 18v3"></path>
                  <path d="M8 21h8"></path>
                </svg>
              </button>
            </div>
          </div>
          <div class="transport">
            <button id="stopBtn" class="icon-btn" aria-label="停止录音" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h8v8H8z"></path></svg>
            </button>
            <label class="switch">
              <input id="injectToggle" type="checkbox" />
              <span></span>
              系统输入
            </label>
            <label class="switch">
              <input id="manualInjectToggle" type="checkbox" />
              <span></span>
              文本测试输入
            </label>
          </div>
        </div>

        <aside class="result-panel">
          <div class="result-block">
            <div class="section-title">
              <span>识别</span>
              <button id="copyRawBtn" class="mini-btn" aria-label="复制识别文本">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 8h10v12H8z"></path><path d="M6 16H4V4h10v2"></path>
                </svg>
              </button>
            </div>
            <p id="rawText" class="result-text muted">等待语音</p>
          </div>
          <div class="result-block">
            <div class="section-title">
              <span>输出</span>
              <button id="copyProcessedBtn" class="mini-btn" aria-label="复制输出文本">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 8h10v12H8z"></path><path d="M6 16H4V4h10v2"></path>
                </svg>
              </button>
            </div>
            <p id="processedText" class="result-text"> </p>
          </div>
          <div class="action-list" id="actionList"></div>
        </aside>
      </section>

      <section class="guide-panel">
        <div class="guide-brand">
          <svg class="brand-mark" viewBox="0 0 128 128" role="img" aria-label="声流输入法">
            <rect width="128" height="128" rx="24" fill="#fffdf8"></rect>
            <path d="M20 90c11-10 22-10 33 0s22 10 33 0 22-10 33 0" fill="none" stroke="#355f9f" stroke-width="7" stroke-linecap="round"></path>
            <path d="M25 101c9-7 18-7 27 0s18 7 27 0 18-7 27 0" fill="none" stroke="#147d73" stroke-width="5" stroke-linecap="round" opacity=".85"></path>
            <rect x="43" y="20" width="42" height="62" rx="21" fill="#147d73"></rect>
            <rect x="53" y="31" width="20" height="37" rx="10" fill="#fffdf8" opacity=".96"></rect>
            <path d="M34 57a30 30 0 0 0 60 0" fill="none" stroke="#24211d" stroke-width="8" stroke-linecap="round"></path>
            <path d="M64 87v15M48 102h32" fill="none" stroke="#24211d" stroke-width="8" stroke-linecap="round"></path>
            <path d="M28 29h12M24 43h16M88 29h12M88 43h16" fill="none" stroke="#b15d17" stroke-width="5" stroke-linecap="round"></path>
          </svg>
          <div>
            <h2>VoxFlow Input</h2>
            <p>后台快捷键：<strong id="hotkeyLabel">Ctrl+Alt+Space</strong></p>
          </div>
        </div>
        <div class="guide-steps">
          <span>1. 打开声流输入法</span>
          <span>2. 把光标放进输入框</span>
          <span>3. 按快捷键后说话</span>
        </div>
      </section>

      <section class="settings-panel">
        <label for="hotkeyInput">快捷键</label>
        <div class="settings-row">
          <input id="hotkeyInput" type="text" value="ctrl+alt+space" spellcheck="false" />
          <button id="saveHotkeyBtn" class="primary-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path>
              <path d="M17 21v-8H7v8"></path>
              <path d="M7 3v5h8"></path>
            </svg>
            保存
          </button>
        </div>
        <p id="hotkeyMessage" class="settings-message"> </p>
      </section>

      <section class="manual-panel">
        <label for="manualText">口语修正测试</label>
        <div class="manual-row">
          <textarea id="manualText" rows="3">今天下午三点哦不四点</textarea>
          <button id="manualBtn" class="primary-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path>
            </svg>
            处理
          </button>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
