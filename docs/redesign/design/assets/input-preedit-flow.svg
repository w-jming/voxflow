<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Cursor preedit feedback flow</title>
  <desc id="desc">How VoxFlow shows listening and partial text at cursor using input method preedit.</desc>
  <rect width="1200" height="420" fill="#F8FAFC"/>
  <text x="48" y="56" fill="#0F172A" font-family="Arial, sans-serif" font-size="30" font-weight="700">光标处实时反馈</text>
  <text x="48" y="88" fill="#475569" font-family="Arial, sans-serif" font-size="16">输入中的主反馈走 preedit/composition，不使用顶部通知表达录音状态</text>

  <rect x="74" y="140" width="1052" height="76" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="104" y="186" fill="#0F172A" font-family="Arial, sans-serif" font-size="24">今天下午</text>
  <rect x="218" y="154" width="164" height="48" rx="8" fill="#E0F2FE" stroke="#0EA5E9"/>
  <text x="238" y="186" fill="#0369A1" font-family="Arial, sans-serif" font-size="22">三点开</text>
  <path d="M394 152v52" stroke="#0F172A" stroke-width="3"/>

  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="76" y="258" width="190" height="72" rx="10" fill="#FFFFFF" stroke="#D7E7F2"/>
    <text x="104" y="286" fill="#0F172A" font-weight="700">1. Listening</text>
    <text x="104" y="312" fill="#475569">preedit: 听写中</text>

    <path d="M286 294h88" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round"/>
    <path d="M362 282l18 12-18 12" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="404" y="258" width="230" height="72" rx="10" fill="#FFFFFF" stroke="#D7E7F2"/>
    <text x="432" y="286" fill="#0F172A" font-weight="700">2. Partial token</text>
    <text x="432" y="312" fill="#475569">preedit 持续更新</text>

    <path d="M654 294h88" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round"/>
    <path d="M730 282l18 12-18 12" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="772" y="258" width="230" height="72" rx="10" fill="#FFFFFF" stroke="#D7E7F2"/>
    <text x="800" y="286" fill="#0F172A" font-weight="700">3. Stable commit</text>
    <text x="800" y="312" fill="#475569">稳定文本写入目标应用</text>
  </g>

  <rect x="76" y="356" width="1050" height="1" fill="#D7E7F2"/>
  <text x="78" y="386" fill="#475569" font-family="Arial, sans-serif" font-size="15">系统通知只用于麦克风不可用、模型失败、Core 崩溃等异常，不用于“开始录音/正在识别/已输入”。</text>
</svg>

