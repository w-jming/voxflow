<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">VoxFlow control center wireframe</title>
  <desc id="desc">Desktop control center layout with sidebar, status cards and model panel.</desc>
  <rect width="1280" height="820" fill="#F8FAFC"/>
  <rect x="32" y="28" width="1216" height="764" rx="18" fill="#FFFFFF" stroke="#D7E7F2" stroke-width="2"/>
  <rect x="32" y="28" width="1216" height="82" rx="18" fill="#E8F7FE"/>
  <rect x="32" y="92" width="1216" height="18" fill="#E8F7FE"/>
  <rect x="58" y="44" width="54" height="54" rx="14" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="2"/>
  <path d="M67 72C72 63 78 63 83 72C88 81 94 81 99 72" fill="none" stroke="#0EA5E9" stroke-width="5" stroke-linecap="round"/>
  <path d="M102 58v28" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  <path d="M98 58h8M98 86h8" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  <text x="116" y="78" fill="#0F172A" font-family="Arial, sans-serif" font-size="28" font-weight="700">VoxFlow 控制台</text>
  <rect x="988" y="50" width="116" height="36" rx="8" fill="#0EA5E9"/>
  <text x="1012" y="74" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">可输入</text>
  <rect x="1120" y="50" width="92" height="36" rx="8" fill="#FFFFFF" stroke="#D7E7F2"/>
  <text x="1143" y="74" fill="#0F172A" font-family="Arial, sans-serif" font-size="16">暂停</text>

  <rect x="32" y="110" width="220" height="682" fill="#F1F8FD" stroke="#D7E7F2"/>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="56" y="140" width="172" height="42" rx="8" fill="#DFF4FF"/>
    <text x="82" y="167" fill="#0369A1" font-weight="700">总览</text>
    <text x="82" y="222" fill="#475569">输入</text>
    <text x="82" y="276" fill="#475569">模型</text>
    <text x="82" y="330" fill="#475569">音频</text>
    <text x="82" y="384" fill="#475569">语义修正</text>
    <text x="82" y="438" fill="#475569">数据</text>
    <text x="82" y="492" fill="#475569">诊断</text>
  </g>

  <text x="292" y="162" fill="#0F172A" font-family="Arial, sans-serif" font-size="30" font-weight="700">现在是否可用</text>
  <text x="292" y="196" fill="#475569" font-family="Arial, sans-serif" font-size="17">输入服务、输入法、麦克风、模型和语义分类器的实时状态</text>

  <g font-family="Arial, sans-serif">
    <rect x="292" y="230" width="428" height="142" rx="10" fill="#FFFFFF" stroke="#D7E7F2" stroke-width="2"/>
    <circle cx="328" cy="268" r="16" fill="#0EA5E9"/>
    <text x="356" y="274" fill="#0F172A" font-size="20" font-weight="700">输入服务</text>
    <rect x="596" y="248" width="82" height="28" rx="14" fill="#E0F2FE"/>
    <text x="618" y="268" fill="#0369A1" font-size="14">运行中</text>
    <text x="320" y="316" fill="#475569" font-size="16">Core 已连接，输入会话可启动</text>
    <rect x="320" y="330" width="86" height="28" rx="6" fill="#0EA5E9"/>
    <text x="340" y="350" fill="#FFFFFF" font-size="14">重启</text>

    <rect x="744" y="230" width="428" height="142" rx="10" fill="#FFFFFF" stroke="#D7E7F2" stroke-width="2"/>
    <circle cx="780" cy="268" r="16" fill="#0EA5E9"/>
    <text x="808" y="274" fill="#0F172A" font-size="20" font-weight="700">输入法前端</text>
    <rect x="1044" y="248" width="82" height="28" rx="14" fill="#E0F2FE"/>
    <text x="1066" y="268" fill="#0369A1" font-size="14">IBus</text>
    <text x="772" y="316" fill="#475569" font-size="16">光标处 preedit 已启用</text>
    <rect x="772" y="330" width="130" height="28" rx="6" fill="#FFFFFF" stroke="#D7E7F2"/>
    <text x="790" y="350" fill="#0F172A" font-size="14">打开输入源</text>

    <rect x="292" y="398" width="428" height="142" rx="10" fill="#FFFFFF" stroke="#D7E7F2" stroke-width="2"/>
    <circle cx="328" cy="436" r="16" fill="#22D3EE"/>
    <text x="356" y="442" fill="#0F172A" font-size="20" font-weight="700">麦克风</text>
    <text x="320" y="484" fill="#475569" font-size="16">OpenFit Headset，输入电平正常</text>
    <rect x="320" y="498" width="180" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="320" y="498" width="118" height="12" rx="6" fill="#22D3EE"/>

    <rect x="744" y="398" width="428" height="142" rx="10" fill="#FFFFFF" stroke="#D7E7F2" stroke-width="2"/>
    <circle cx="780" cy="436" r="16" fill="#0EA5E9"/>
    <text x="808" y="442" fill="#0F172A" font-size="20" font-weight="700">实时流式模型</text>
    <text x="772" y="484" fill="#475569" font-size="16">Streaming Small · zh/en · 本地可用</text>
    <rect x="772" y="498" width="98" height="28" rx="6" fill="#0EA5E9"/>
    <text x="796" y="518" fill="#FFFFFF" font-size="14">切换</text>

    <rect x="292" y="566" width="880" height="146" rx="10" fill="#FFFFFF" stroke="#D7E7F2" stroke-width="2"/>
    <text x="320" y="606" fill="#0F172A" font-size="20" font-weight="700">语义撤销分类器</text>
    <rect x="516" y="584" width="96" height="28" rx="14" fill="#E0F2FE"/>
    <text x="536" y="604" fill="#0369A1" font-size="14">P0 可用</text>
    <text x="320" y="646" fill="#475569" font-size="16">规则状态机 + 轻量分类器 + 账本安全门。低置信度自动按原文输入。</text>
    <rect x="320" y="666" width="178" height="28" rx="6" fill="#FFFFFF" stroke="#D7E7F2"/>
    <text x="342" y="686" fill="#0F172A" font-size="14">查看最近修正</text>
  </g>
</svg>
