[package]
name = "voxflow-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Real-mic dictation smoke (asr-live); needs libpipewire dev files to build.
live-asr = ["voxflow-audio/pipewire-native"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq = { version = "2", default-features = false, features = ["tls"] }
hex.workspace = true
ferrous-opencc = "0.4"
indexmap.workspace = true
voxflow-asr.workspace = true
voxflow-asr-qwen3.workspace = true
voxflow-asr-sherpa.workspace = true
voxflow-asr-volcano.workspace = true
voxflow-audio.workspace = true
voxflow-input.workspace = true
voxflow-ipc.workspace = true

[[bin]]
name = "asr-live"
path = "src/bin/asr_live.rs"
required-features = ["live-asr"]
